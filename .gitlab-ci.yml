workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - lint
  - test

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_LINK_MODE: copy

default:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  cache:
    key:
      files: [ingestion/uv.lock, dbt/uv.lock]
    paths: [.uv-cache]
  before_script:
    - cd ingestion
    - uv sync --locked

lint:
  stage: lint
  script:
    - uv run ruff format --check .
    - uv run ruff check .

test:
  stage: test
  script:
    - uv run pytest

dbt_build:
  stage: test
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  services:
    - name: pgvector/pgvector:pg16
      alias: postgres
  variables:
    POSTGRES_USER: analytics
    POSTGRES_PASSWORD: analytics
    POSTGRES_DB: dwh
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    RAW_DATA_DIR: "$CI_PROJECT_DIR/data/sample"
  before_script: []
  script:
    - cd "$CI_PROJECT_DIR/ingestion" && uv sync --locked
    - uv run python load_raw.py
    - cd "$CI_PROJECT_DIR/dbt" && uv sync --locked
    - uv run dbt build

.mcp_server:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  cache:
    key:
      files: [mcp_server/uv.lock]
    paths: [.uv-cache]
  before_script:
    - cd mcp_server
    - uv sync --locked

mcp_lint:
  extends: .mcp_server
  stage: lint
  script:
    - uv run ruff format --check .
    - uv run ruff check .

mcp_test:
  extends: .mcp_server
  stage: test
  script:
    - uv run pytest