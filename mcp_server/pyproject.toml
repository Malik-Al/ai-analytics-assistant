[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "olist-mcp"
version = "0.1.0"
description = "MCP server exposing the Olist data warehouse to LLM agents"
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.3,<3",
    "openai>=3.57",
    "psycopg[binary]>=3.3",
    "pydantic-settings>=2.0",
    "sqlglot>=30.33",
]

[project.scripts]
olist-mcp = "olist_mcp.entrypoints.mcp_app:main"
olist-index-docs = "olist_mcp.entrypoints.index_docs:main"

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
