[project]
name = "mcp-server"
version = "0.1.0"
description = "MCP server exposing the Olist data warehouse to LLM agents"
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.3,<3",
    "psycopg[binary]>=3.3",
    "sqlglot>=30.33",
]

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
