[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "olist-agent"
version = "0.1.0"
description = "LangGraph agent that answers analytics questions through the olist-mcp tools"
requires-python = ">=3.13"
dependencies = [
    "langchain-mcp-adapters>=0.3",
    "langchain-openai>=1.8",
    "langgraph>=1.2",
    "pydantic-settings>=2.0",
]

[project.scripts]
olist-agent = "olist_agent.cli:main"

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
