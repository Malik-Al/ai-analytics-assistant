version: 2

models:
  - name: dim_customers
    description: One row per real customer (customer_unique_id).
    columns:
      - name: customer_unique_id
        data_tests: [unique, not_null]

  - name: dim_products
    description: One row per product.
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: dim_sellers
    description: One row per seller.
    columns:
      - name: seller_id
        data_tests: [unique, not_null]

  - name: dim_date
    description: One row per calendar day 2016-2018.
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: fct_order_items
    description: One row per item in an order.
    columns:
      - name: order_item_key
        data_tests: [unique, not_null]
      - name: customer_unique_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_unique_id
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: seller_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id
      - name: order_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

  - name: fct_orders
    description: One row per order.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_unique_id
      - name: order_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day